<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Header</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/custom.js"></script>
  </head>
  
  <body>
    <div class="wrapper">
      <header>
        <div class="container">
          <div class="logo">
            <a href="index.html">
              <img src="images/logo2.png" alt="logo">
            </a>
          </div> <!-- logo -->
        </div> <!-- container -->
      </header>

      <div class="vid">
        <video autoplay muted loop>
          <source src="images/nike.mp4" type="vide/mp4">
        </video>
      </div>

    </div> <!-- wrapper -->
  </body>
</html>
